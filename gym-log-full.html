<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#e8590c">
<title>Gym Log</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1a;--mut:#6b6b66;--acc:#e8590c;--line:#e4e2dc;--danger:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--ink:#f2f1ed;--mut:#9a9992;--line:#2e2e2b;--danger:#ff8787}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--ink:#f2f1ed;--mut:#9a9992;--line:#2e2e2b;--danger:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.row small{display:block;color:var(--mut)}
.row .l{display:flex;align-items:center;min-width:0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;margin-right:10px;flex:none}
.mut{color:var(--mut)}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;border-radius:18px;font-size:14px;padding:0 12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.add{display:flex;gap:8px}
input,textarea{flex:1;min-width:0;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px 12px}
input{min-height:44px}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:10px}
.step button{padding:0;font-size:22px}
.step input{text-align:center;font-size:22px;font-weight:600}
.lbl{font-size:13px;color:var(--mut);margin-bottom:4px}
.stats{display:flex;gap:8px;margin:12px 0}
.stats .card{flex:1;margin:0}
.stats b{font-size:18px;display:block}
.set{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set small{display:block;color:var(--mut)}
.x{min-height:32px;width:32px;padding:0;border:0;background:none;color:var(--mut);font-size:20px}
.del{color:var(--danger);width:100%;margin-top:24px}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block;margin:12px 0 0}
.pbar{display:flex;gap:8px;margin-top:8px}
.pbar button{flex:1;min-height:38px;font-size:14px}
svg text{fill:var(--mut);font-size:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input id="file" type="file" accept="image/*" hidden>
<script>
const KEY='gymlog:v2',PRE=['Leg Press','Lat Pulldown','Chest Press','Seated Row','Shoulder Press','Leg Extension','Leg Curl','Pec Deck'];
let S={unit:'lb',machines:[],sets:[]},cur=null,draft={w:'',r:'',n:''},confirmDel=false,cm='e',IMG={},DB=null;
try{const raw=localStorage.getItem(KEY)||localStorage.getItem('gymlog:v1');if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey=t=>new Date(t).toDateString();
const shortDate=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const dayLabel=t=>dayKey(t)===dayKey(Date.now())?'Today':shortDate(t);
const fmt=s=>`${s.w} ${S.unit} × ${s.r}`;
const setsOf=id=>S.sets.filter(s=>s.m===id);

/* photos live in IndexedDB (too big for localStorage) */
function loadImgs(cb){
  try{
    const q=indexedDB.open('gymlog',1);
    q.onupgradeneeded=()=>q.result.createObjectStore('img');
    q.onerror=()=>cb();
    q.onsuccess=()=>{DB=q.result;const c=DB.transaction('img').objectStore('img').openCursor();
      c.onsuccess=()=>{const u=c.result;if(u){IMG[u.key]=u.value;u.continue();}else cb();};
      c.onerror=()=>cb();};
  }catch(e){cb();}
}
function putImg(id,url){IMG[id]=url;try{DB&&DB.transaction('img','readwrite').objectStore('img').put(url,id);}catch(e){}}
function delImg(id){delete IMG[id];try{DB&&DB.transaction('img','readwrite').objectStore('img').delete(id);}catch(e){}}
function shrink(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72));};
    im.src=r.result;};
  r.readAsDataURL(file);
}

function groupsByDay(ss){
  const out=[];
  ss.forEach(s=>{const d=dayKey(s.t);let g=out.find(x=>x.d===d);if(!g){g={d,t:s.t,list:[]};out.push(g);}g.list.push(s);});
  return out;
}

function chart(ss){
  const pts=groupsByDay(ss).map(g=>{
    let v=0;
    g.list.forEach(s=>{const x=cm==='w'?s.w:cm==='e'?s.w*(1+s.r/30):s.w*s.r;v=cm==='v'?v+x:Math.max(v,x);});
    return{t:g.t,v:Math.round(v*10)/10};
  }).slice(-12);
  const tabs=[['e','Est. 1RM'],['w','Top weight'],['v','Volume']].map(x=>`<button class="chip${cm===x[0]?' on':''}" data-a="cm" data-v="${x[0]}">${x[1]}</button>`).join('');
  let body;
  if(pts.length<2)body='<p class="mut" style="margin:10px 0 0">Log sets on 2+ different days to see your progress.</p>';
  else{
    const W=320,H=140,L=38,R=10,T=10,B=22;
    let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
    if(hi===lo){hi+=1;lo-=1;}
    const X=i=>L+(W-L-R)*i/(pts.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
    const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="var(--acc)"/>`).join('');
    body=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Progress chart">
<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--line)"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--line)"/>
<text x="${L-4}" y="${T+4}" text-anchor="end">${Math.round(hi)}</text><text x="${L-4}" y="${H-B}" text-anchor="end">${Math.round(lo)}</text>
<polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
<text x="${L}" y="${H-6}">${shortDate(pts[0].t)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(pts[pts.length-1].t)}</text></svg>`;
  }
  return `<div class="card"><div class="chips" style="margin:0 0 6px">${tabs}</div>${body}</div>`;
}

function home(){
  const used=S.machines.map(m=>m.name.toLowerCase());
  const chips=PRE.filter(p=>!used.includes(p.toLowerCase())).map(p=>`<button class="chip" data-a="preset" data-v="${p}">+ ${p}</button>`).join('');
  const list=S.machines.map(m=>{
    const ss=setsOf(m.id),l=ss[ss.length-1];
    return `<button class="card row" data-a="open" data-v="${m.id}"><span class="l">${IMG[m.id]?`<img class="thumb" src="${IMG[m.id]}" alt="">`:''}<span><b>${esc(m.name)}</b><small>${l?fmt(l)+' · '+shortDate(l.t):'No sets yet'}</small></span></span><span class="mut">›</span></button>`;
  }).join('')||'<p class="mut">No machines yet. Add one below.</p>';
  return `<div class="top"><h1>Gym Log</h1><button data-a="unit">${S.unit}</button></div>${list}
<h2>Add a machine</h2><div class="add"><input id="newm" placeholder="e.g. Hammer Strength Row" maxlength="40"><button class="pri" data-a="add">Add</button></div>${chips?`<div class="chips">${chips}</div>`:''}`;
}

function machine(){
  const m=S.machines.find(x=>x.id===cur);
  if(!m){cur=null;return home();}
  const ss=setsOf(cur);let best=null;
  ss.forEach(s=>{if(!best||s.w>best.w||(s.w===best.w&&s.r>best.r))best=s;});
  const last=ss[ss.length-1];
  const hist=groupsByDay(ss).reverse().slice(0,10).map(g=>{
    const items=g.list.slice().reverse().map((s,i)=>`<div class="set"><span><span class="mut">${i+1}.</span> <b>${fmt(s)}</b>${s.n?`<small>${esc(s.n)}</small>`:''}</span><button class="x" data-a="dels" data-v="${s.id}" aria-label="Delete set">×</button></div>`).join('');
    return `<div class="card"><div class="lbl">${dayLabel(g.t)} · ${g.list.length} set${g.list.length>1?'s':''}</div>${items}</div>`;
  }).join('')||'<p class="mut">No sets logged yet.</p>';
  const photo=IMG[cur]
    ?`<img class="photo" src="${IMG[cur]}" alt="${esc(m.name)}"><div class="pbar"><button data-a="photo">Change photo</button><button data-a="rmphoto">Remove</button></div>`
    :`<div class="pbar"><button data-a="photo">📷 Add photo</button></div>`;
  return `<div class="top"><button data-a="back">‹ Back</button><button data-a="unit">${S.unit}</button></div>
<h1>${esc(m.name)}</h1>${photo}
<div class="stats"><div class="card"><span class="lbl">Best set</span><b>${best?fmt(best):'—'}</b></div><div class="card"><span class="lbl">Last session</span><b>${last?dayLabel(last.t):'—'}</b></div></div>
${chart(ss)}
<h2>Log a set</h2>
<div class="lbl">Weight (${S.unit})</div><div class="step"><button data-a="wm">−</button><input id="w" type="number" inputmode="decimal" min="0" step="any" value="${draft.w}" placeholder="0"><button data-a="wp">+</button></div>
<div class="lbl">Reps</div><div class="step"><button data-a="rm">−</button><input id="r" type="number" inputmode="numeric" min="0" step="1" value="${draft.r}" placeholder="0"><button data-a="rp">+</button></div>
<input id="n" maxlength="120" placeholder="Set note (optional)" value="${esc(draft.n)}" style="margin-bottom:10px">
<button class="pri" style="width:100%" data-a="log">Log set</button>
<h2>Machine notes</h2><textarea id="mn" rows="3" placeholder="Seat height, pad position, grip…">${esc(m.note||'')}</textarea>
<h2>History</h2>${hist}
<button class="del" data-a="delm">${confirmDel?'Tap again to delete machine and its history':'Delete machine'}</button>`;
}

function render(){$('app').innerHTML=cur?machine():home();}
function addMachine(name){
  name=(name||'').trim();if(!name)return;
  if(S.machines.some(m=>m.name.toLowerCase()===name.toLowerCase()))return;
  S.machines.push({id:uid(),name});save();render();
}
function nudge(k,d){
  const step=k==='w'?(S.unit==='kg'?2.5:5):1;
  draft[k]=String(Math.max(0,Math.round(((+draft[k]||0)+d*step)*10)/10));render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a!=='delm')confirmDel=false;
  if(a==='preset')addMachine(v);
  else if(a==='add')addMachine($('newm').value);
  else if(a==='open'){cur=v;const ss=setsOf(v),l=ss[ss.length-1];draft=l?{w:String(l.w),r:String(l.r),n:''}:{w:'',r:'',n:''};render();window.scrollTo(0,0);}
  else if(a==='back'){cur=null;render();}
  else if(a==='unit'){S.unit=S.unit==='lb'?'kg':'lb';save();render();}
  else if(a==='cm'){cm=v;render();}
  else if(a==='wm')nudge('w',-1);
  else if(a==='wp')nudge('w',1);
  else if(a==='rm')nudge('r',-1);
  else if(a==='rp')nudge('r',1);
  else if(a==='photo')$('file').click();
  else if(a==='rmphoto'){delImg(cur);render();}
  else if(a==='log'){
    const w=+draft.w||0,r=+draft.r||0;
    if(r<=0){$('r').focus();return;}
    S.sets.push({id:uid(),m:cur,w,r,n:(draft.n||'').trim(),t:Date.now()});draft.n='';save();render();
  }
  else if(a==='dels'){S.sets=S.sets.filter(s=>s.id!==v);save();render();}
  else if(a==='delm'){
    if(!confirmDel){confirmDel=true;render();return;}
    S.machines=S.machines.filter(m=>m.id!==cur);S.sets=S.sets.filter(s=>s.m!==cur);
    delImg(cur);cur=null;confirmDel=false;save();render();
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='w'||id==='r'||id==='n')draft[id]=e.target.value;
  if(id==='mn'){const m=S.machines.find(x=>x.id===cur);if(m){m.note=e.target.value;save();}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='file'&&e.target.files[0]&&cur){
    const id=cur;shrink(e.target.files[0],url=>{putImg(id,url);if(cur===id)render();});
    e.target.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newm')addMachine(e.target.value);});
render();
loadImgs(render);
</script>
</body>
</html>
